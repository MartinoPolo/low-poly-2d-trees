name: CI

on:
    pull_request:
        branches: [dev, main]
    push:
        branches: [dev, main]

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm cf:types
            - run: pnpm paraglide:compile
            - run: pnpm check:all
            - name: Audit changed files for quality regressions
              if: github.event_name == 'pull_request'
              run: fallow audit --format json --quiet --explain --base origin/${{ github.base_ref }}
            - run: pnpm test -- --coverage
            - run: pnpm exec playwright install --with-deps chromium
            - name: Create .env and .dev.vars for e2e build + preview server
              run: |
                  echo "DATABASE_URL=postgresql://test:test@localhost:5432/test" > .env
                  echo "AUTH_SECRET=ci-test-secret-not-for-production" >> .env
                  cp .env .dev.vars
            - run: pnpm test:e2e
